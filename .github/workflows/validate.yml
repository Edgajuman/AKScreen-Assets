name: Validate community assets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate catalogue, licenses, paths, sizes, file types and SHA-256
        run: python3 tools/validate_catalogue.py
