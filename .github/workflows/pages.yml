name: Publish asset library website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: asset-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/validate_catalogue.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Stage public site
        run: |
          mkdir site
          cp index.html catalogue.css catalogue.js catalogue.json site/
          cp -R packages site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
